# FIX-15: Strict Security & Edge Cache Headers (vercel.json)

- **Category:** Security & Infrastructure
- **Target Page:** vercel.json (Deployment Configuration)
- **Priority:** P2 - Medium
- **Problem Identified:** Missing explicit edge caching headers and security policies in vercel.json.
- **Evidence from Live Audit:** Server responses from incubrix.com show generic Vercel defaults without fine-grained stale-while-revalidate policies on assets.
- **Validation Benchmark:** Mozilla Observatory & SecurityHeaders.com (Target: A+ Grade)

## Ready-to-Paste Code / Text Block

```conf
{
  "headers": [
    {
      "source": "/(.*)",
      "headers": [
        { "key": "X-Content-Type-Options", "value": "nosniff" },
        { "key": "X-Frame-Options", "value": "DENY" },
        { "key": "X-XSS-Protection", "value": "1; mode=block" },
        { "key": "Referrer-Policy", "value": "strict-origin-when-cross-origin" },
        { "key": "Permissions-Policy", "value": "camera=(), microphone=(), geolocation=()" },
        { "key": "Strict-Transport-Security", "value": "max-age=63072000; includeSubDomains; preload" }
      ]
    },
    {
      "source": "/assets/(.*)",
      "headers": [
        { "key": "Cache-Control", "value": "public, max-age=31536000, immutable" }
      ]
    }
  ]
}
```
